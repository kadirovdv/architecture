<div class="lessons">
  <div class="container">
    <div class="carousel" #carousel>
      <button 
        class="carousel-btn prev" 
        (click)="prevSlide()"
        [attr.aria-label]="'Previous slide'"
      >
        <img src="./assets/img/slide-left.png" alt="Previous slide">
      </button>

      <div class="carousel-wrapper">
        <div class="carousel-slide" [class.active]="true">
          <div class="container">
            <div class="slides-container">
              <div
                class="slides-wrapper d-flex"
                [style.transform]="'translateX(' + currentTranslate + 'px)'"
                role="list"
                aria-label="Lesson slides"
              >
                <div
                  *ngFor="let lesson of websiteLessons; let i = index"
                  class="media-item"
                  [class.active]="isActiveSlide(i)"
                  (click)="selectSlide(i)"
                  role="listitem"
                  [attr.aria-label]="getTitle(lesson)"
                  [attr.aria-current]="isActiveSlide(i) ? 'true' : 'false'"
                >
                  <div class="lesson-image">
                    <img
                      [src]="lesson.thumbnail"
                      [alt]="getTitle(lesson)"
                      class="lesson-thumbnail"
                      loading="lazy"
                    />
                  </div>
                  <div class="lesson-title">{{ getTitle(lesson) }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button 
        class="carousel-btn next" 
        (click)="nextSlide()"
        [attr.aria-label]="'Next slide'"
      >
        <img src="./assets/img/slide-right.png" alt="Next slide">
      </button>
    </div>
    <div class="row">
      <div class="col-md-8">
        <div class="file-content">
          <h3>
            Grafik topshiriq variantlari
          </h3>
          <div class="file-content-body">
            
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="file-selection">
          
        </div>
      </div>
    </div>
  </div>
</div>
