<div class="loader-content" *ngIf="loading">
  <div class="loader-box">
    <small>Yuklanmoqda...</small>
    <app-loader></app-loader>
  </div>
</div>
<div class="create-build-content">
  <div class="create-build-card">
    <button
      class="mb-3 bg-none border-0"
      style="width: 50px"
    >
      <img src="/assets/svg/arrow-left.svg" class="w-100" alt="arrow-left" />
    </button>
    <div class="row">
      <div
        class="col-md-12 mb-3 d-flex justify-content-center align-items-center flex-column"
      >
        <ng-select
          [(ngModel)]="lesson"
          class="create-build-ng-select mb-4"
          placeholder="Fanni tanlang..."
        >
          <ng-option *ngFor="let lesson of lessons" [value]="lesson">
            {{ lesson.lessonTitle?.uz }} - {{ lesson.lessonTitle?.ru }} -
            {{ lesson.lessonTitle?.en }}
          </ng-option>
        </ng-select>
        <div class="create-build-ng-card">Grafik topshiriqni tanlang</div>
        <div class="container my-4">
          <div class="row">
            <div class="col-md-6">
              <div class="position-relative">
                <input
                  type="file"
                  hidden
                  #hiddenInput
                  multiple
                />
                <div
                  class="bg-none p-0 position-absolute-btn"
                  (click)="hiddenInput.click()"
                >
                  <img src="/assets/svg/plus.svg" width="30px" alt="upload" />
                </div>
                <ng-select
                  class="create-build-ng-select-file mb-4"
                  placeholder="GRAFIK TOPSHIRIQ YECHIMI NAMUNALARI (PDF),(PPT)"
                  [clearable]="false"
                  searchable="false"
                >
                
                </ng-select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="position-relative">
                <input
                  type="file"
                  hidden
                  #hiddenInput
                  multiple
                />
                <div
                  class="bg-none p-0 position-absolute-btn"
                  (click)="hiddenInput.click()"
                >
                  <img src="/assets/svg/plus.svg" width="30px" alt="upload" />
                </div>
                <ng-select
                  class="create-build-ng-select-file mb-4"
                  placeholder="GRAFIK TOPSHIRIQLAR VARIANTLARI"
                  [clearable]="false"
                  searchable="false"
                >
                 
                </ng-select>
              </div>
            </div>
          </div>
        </div>
        <div class="create-build-ng-card">Didaktik materiallar</div>
        <div class="container my-4">
          <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6">
              <div class="position-relative">
                <input
                  type="file"
                  hidden
                  #hiddenInput
                  multiple
                />
                <div
                  class="bg-none p-0 position-absolute-btn"
                  (click)="hiddenInput.click()"
                >
                  <img src="/assets/svg/plus.svg" width="30px" alt="upload" />
                </div>
                <ng-select
                  class="create-build-ng-select-file mb-4"
                  placeholder="MA’RUZA MATNI"
                  [clearable]="false"
                  searchable="false"
                >
               
                </ng-select>
              </div>
            </div>
            <div class="col-md-3"></div>
            <div class="col-md-6">
              <div class="position-relative">
                <input
                  type="file"
                  hidden
                  #hiddenInput
                  multiple
                />
                <div
                  class="bg-none p-0 position-absolute-btn"
                  (click)="hiddenInput.click()"
                >
                  <img src="/assets/svg/plus.svg" width="30px" alt="upload" />
                </div>
                <ng-select
                  class="create-build-ng-select-file mb-4"
                  placeholder="PREZENTATSIYA"
                  [clearable]="false"
                  searchable="false"
                >
                  
                </ng-select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="position-relative">
                <div class="bg-none p-0 position-absolute-btn">
                  <img src="/assets/svg/plus.svg" width="30px" alt="upload" />
                </div>
                <ng-select
                  class="create-build-ng-select-file mb-4"
                  placeholder="VIDEO DARS"
                  [clearable]="false"
                  searchable="false"
                >
                
                </ng-select>
              </div>
            </div>
            <div class="col-md-3"></div>
            <div class="col-md-6">
              <div class="position-relative">
                <input
                  type="file"
                  hidden
                  #hiddenInput
                  multiple
                />
                <div
                  class="bg-none p-0 position-absolute-btn"
                  (click)="hiddenInput.click()"
                >
                  <img src="/assets/svg/plus.svg" width="30px" alt="upload" />
                </div>
                <ng-select
                  class="create-build-ng-select-file mb-4"
                  placeholder="FAN BO’YICHA  ADABIYOTLAR"
                  [clearable]="false"
                  searchable="false"
                >
                
                </ng-select>
              </div>
            </div>
            <div class="col-md-3"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end pe-3">
      <img src="/assets/svg/save.svg" class="cursor-pointer" width="30px" alt="next" />
    </div>
  </div>
</div>
